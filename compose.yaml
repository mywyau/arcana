services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: arcana
      POSTGRES_USER: arcana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arcana_local_only}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcana -d arcana"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - arcana_postgres:/var/lib/postgresql/data

volumes:
  arcana_postgres:
