databases:
  - name: arcana-beta-db
    databaseName: arcana
    user: arcana
    plan: basic-1gb
    region: frankfurt
    ipAllowList: []

services:
  - type: web
    name: arcana-beta-server
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    numInstances: 1
    healthCheckPath: /ready
    envVars:
      - key: ARCANA_ENV
        value: production
      - key: ARCANA_ENABLE_DEBUG_CONTENT
        value: "false"
      - key: ARCANA_ALLOW_GUEST_AUTH
        value: "false"
      - key: ARCANA_TRUST_PROXY_HEADERS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: arcana-beta-db
          property: connectionString
